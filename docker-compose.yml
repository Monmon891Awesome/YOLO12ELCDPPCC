version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pneumai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pneumai_db}
      POSTGRES_USER: ${POSTGRES_USER:-pneumai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pneumai_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pneumai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pneumai-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pneumai-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-pneumai}:${POSTGRES_PASSWORD:-pneumai_password}@db:5432/${POSTGRES_DB:-pneumai_db}
      
      # Application settings
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-chars-12345678}
      
      # File storage
      UPLOAD_DIR: /app/uploads
      MODEL_PATH: /app/best.pt
      
      # Server configuration
      HOST: 0.0.0.0
      PORT: 8000
      
      # Database pool settings
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      
      # CORS origins
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
      
      # File upload limits
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
    volumes:
      - uploads_data:/app/uploads
      - ./best.pt:/app/best.pt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pneumai-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  pneumai-network:
    driver: bridge
